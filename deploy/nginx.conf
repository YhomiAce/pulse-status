# Example nginx server block for serving the built site from dist/.
# Every unknown path falls back to index.html so client-side routes
# such as /services/3 and /admin work after a refresh.
server {
    listen 5107;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, or users keep an old build.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
